name: Android build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_debug_preview:
        description: 'Publish a developer-only debug prerelease (not approved for daily use)'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug assembleRelease testDebugUnitTest lintDebug lintRelease --stacktrace
      - name: Verify packaged permission boundary
        run: python3 scripts/verify_apk.py app/build/outputs/apk/debug/app-debug.apk --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
  preview:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_debug_preview && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: preview
      - name: Publish an explicitly labeled development preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mv preview/app-debug.apk preview/dynamic-island-debug.apk
          cd preview
          sha256sum dynamic-island-debug.apk > SHA256SUMS
          cat > notes.md <<'NOTES'
          Developer testing build, signed with a debug key. Not a production release or a recommendation for daily use.

          Play Protect has blocked a previous build because this app requests sensitive notification/overlay access. Do not disable Play Protect or bypass an installation block. A passing CI build or valid signature does not guarantee Google approval.

          Read SAFETY.md in the repository. Production distribution requires a managed release signing identity, device validation, and applicable store/security review. Debug certificates can differ between builds.
          NOTES
          gh release create "preview-${{ github.run_number }}-${{ github.run_attempt }}" dynamic-island-debug.apk SHA256SUMS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Development preview ${{ github.run_number }} (debug APK)" --notes-file notes.md
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EXPECTED_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
      STORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check signing configuration
        id: signing
        shell: bash
        run: |
          if [[ -n "$STORE_B64" && -n "$SIGNING_STORE_PASSWORD" && -n "$SIGNING_KEY_ALIAS" && -n "$SIGNING_KEY_PASSWORD" && -n "$EXPECTED_SIGNING_CERT_SHA256" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Signing secrets or public certificate pin incomplete; no production APK will be published.'
          fi
      - uses: actions/setup-java@v5
        if: steps.signing.outputs.configured == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
        if: steps.signing.outputs.configured == 'true'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.configured == 'true'
      - name: Build and verify signed release
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          export SIGNING_STORE_FILE="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$SIGNING_STORE_FILE"' EXIT
          printf '%s' "$STORE_B64" | base64 --decode > "$SIGNING_STORE_FILE"
          ./gradlew assembleRelease lintRelease
          python3 scripts/verify_apk.py app/build/outputs/apk/release/app-release.apk --production --expected-cert-sha256 "$EXPECTED_SIGNING_CERT_SHA256" --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" > APK-VERIFICATION.txt
          sha256sum app/build/outputs/apk/release/app-release.apk > SHA256SUMS
      - name: Publish release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk APK-VERIFICATION.txt SHA256SUMS --verify-tag --generate-notes
