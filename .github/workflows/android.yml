name: Android build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
  preview:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: preview
      - name: Publish an explicitly labeled development preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mv preview/app-debug.apk preview/dynamic-island-debug.apk
          cd preview
          sha256sum dynamic-island-debug.apk > SHA256SUMS
          cat > notes.md <<'NOTES'
          Development preview, signed with a debug key. This is not a production release.

          On an Android 10+ phone, download dynamic-island-debug.apk below and open it to install. Do not download the source ZIP to install the app.

          Allow installation from your browser when Android prompts, then grant overlay and notification access inside the app and select your applications.

          Debug signatures can differ between builds. If Android reports an incompatible update, uninstall the previous debug app first; this resets its preferences. Production releases require a configured release key.
          NOTES
          gh release create "preview-${{ github.run_number }}-${{ github.run_attempt }}" dynamic-island-debug.apk SHA256SUMS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Development preview ${{ github.run_number }} (debug APK)" --notes-file notes.md
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      STORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check signing configuration
        id: signing
        shell: bash
        run: |
          if [[ -n "$STORE_B64" && -n "$SIGNING_STORE_PASSWORD" && -n "$SIGNING_KEY_ALIAS" && -n "$SIGNING_KEY_PASSWORD" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Signing secrets incomplete; no production APK will be published.'
          fi
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
        if: steps.signing.outputs.configured == 'true'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.configured == 'true'
      - name: Build and verify signed release
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          export SIGNING_STORE_FILE="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$SIGNING_STORE_FILE"' EXIT
          printf '%s' "$STORE_B64" | base64 --decode > "$SIGNING_STORE_FILE"
          ./gradlew assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
      - name: Publish release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk --verify-tag --generate-notes
